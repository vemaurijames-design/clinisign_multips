services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234567
      POSTGRES_DB: clinisign_master
    ports:
      - "5432:5432"
    volumes:
      - clinisign_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      MASTER_DB_URL: jdbc:postgresql://postgres:5432/clinisign_master
      MASTER_DB_USER: postgres
      MASTER_DB_PASSWORD: 1234567
      PROVISIONING_DB_URL: jdbc:postgresql://postgres:5432/
      PROVISIONING_DB_USER: postgres
      PROVISIONING_DB_PASSWORD: 1234567
      TENANT_DB_HOST: postgres
      TENANT_DB_PORT: 5432
      CORS_ORIGINS: "*"
      CLINISIGN_MAIL_HOST: smtp.gmail.com
      CLINISIGN_MAIL_PORT: 587
      CLINISIGN_MAIL_USERNAME: inforclinisign@gmail.com
      CLINISIGN_MAIL_PASSWORD: zsmqvrubdibyejci
      CLINISIGN_MAIL_FROM: inforclinisign@gmail.com
    ports:
      - "8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "80:80"
    restart: unless-stopped

volumes:
  clinisign_pg:
